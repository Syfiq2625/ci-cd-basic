[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sys_cli"
version = "0.1.0"
description = "A simple Typer CLI for CI/CD learning"
authors = [{name = "Syafiq"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0"
]

[project.scripts]
sys-cli = "sys_cli.main:app"
