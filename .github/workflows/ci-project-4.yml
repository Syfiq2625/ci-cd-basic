name: CI Project 4

on:
  push:
    branches: [main]
    paths: 'project-4/**'

  pull_request:
    branches: [main]
    paths: 'project-4/**'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./project-4
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
    
      - name: Setup Python
        id: Setup-Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"
    
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Tests
        run: python -m pytest -v    
        


