name: CI Project-5 (Data csv)

on:
  push:
    branches: [main]
    paths: 'project-5/**'

  pull_request:
    branches: [main]
    paths: 'project-5/**'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./project-5
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup-Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        
      - name: Python-Version
        id: python-version
        run: |
          if ["$PYTHONVERSION" == 3.12]; then
            echo "python_version=3.12" >> "$GITHUB_OUTPUT"
          else
            echo "python_version=invalid" >> "$GITHUB_OUTPUT"
          fi
        env:
          PYTHONVERSION: 3.12
            

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Run tests
        run: python -m pytest -v

      - name: Error tests
        run: exit 1
        continue-on-error: true

      - name: Version Success
        run: echo "Version Success, Version python is ${{steps.python-version.outputs.python_version}}"
