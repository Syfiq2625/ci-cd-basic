name: CI Project 8 (Math)

on:
  push:
    branches: [main]
    paths:
      - 'project-8/**'

  pull_request:
    branches: [main]
    paths:
      - 'project-8/**'

  workflow_dispatch:


defaults:
  run:
    working-directory: ./project-8
    shell: bash


jobs: 
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: project-8/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Type Check & Format
        run: |
          ruff check . --fix
          ruff format .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      max-parallel: 2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: project-8/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test
        run: python -m pytest -v


