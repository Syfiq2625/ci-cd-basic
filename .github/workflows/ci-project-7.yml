name: CI Project 7 (TaskCLI)

on:
  push:
    branches: [main]
    paths: "project-7/**"

  pull_request:
    branches: [main]
    paths: "project-7/**"

  worflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './project-7'
        shell: bash

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    step:
      -name: Checkout Repository
       uses: actions/checkout@v4

      -name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: ${{ matrix.python_version }}
         cache: 'pip'
         path: requirements-dev.txt

      -name: Install Dependencies
       run: |
         python -m pip install --upgrade pip
         pip install requirements-dev.txt

      -name: Ruff Check & Format
       run: |
         ruff check .
         ruff format --check .

  type_check:
    runs-on: ubuntu-latest
    needs: [lint]

    defaults:
      run:
        working-directory: './project-7'
        shell: bash

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    step:
      -name: Checkout Repository
       uses: actions/checkout@v4

      -name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: ${{ matrix.python-version }}
         cache: 'pip'
         path: requirements-dev.txt

      -name: Install Dependencies
       run: |
         python -m pip install --upgrade pip
         pip install -r requirements-dev.txt

      -name: Run Type Check
       run: mypy .

  test:
    runs_on: ubuntu-latest
    needs: [lint, type_check]

    defaults:
      run:
        working-directory: './project-7'
        shell: bash

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    step:
      -name: Checkout Repository
       uses: actions/checkout@v4

      -name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: ${{ matrix.python-version }}
         cache: 'pip'
         paths: requirements-dev.txt

      -name: Install Dependencies
       run: |
         python -m pip install --upgrade pip
         pip install requirements-dev.txt

      -name: Run Test
       run: python -m pytest -v
