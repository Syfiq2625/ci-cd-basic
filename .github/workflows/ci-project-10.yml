name: CI Project 10 (CLI Sederhana)

on:
  push:
    branches: [main]
    paths:
      - 'project-10/**'
      - '.github/workflows/ci-project-10.yml'

  pull_request:
    branches: [main]
    paths:
      - 'project-10/**'
      - '.github/workflows/ci-project-10.yml'

  workflow_dispatch:

defaults:
  run:
    working-directory: ./project-10
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: project-10/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Format
        run: |
          pip check .
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Check Security
        run: |
          bandit -r src/sys_cli -ll
          pip-audit -r requirements.txt

      - name: Install mypy
        run: pip install mypy

      - name: Type Check
        run: mypy .

  test:
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      max-parallel: 2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: project-10/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test
        run: |
          python -m pytest -v --junitxml=test-result.xml
          python -m pytest --cov=. --cov-report=xml:coverege.xml

      - name: Upload Test Result
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: test-result.xml

      - name: Upload Coverege Report
        uses: actions/upload-artifact@v4
        with:
          name: coverege-report
          path: coverege.xml

  build:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: action/setup-python@v5
        with:
         python-version: '3.12'
         cache: 'pip'
         cache-dependency-path: project-10/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Package
        run: python -m build

      - name: Validation Package
        run: python -m twine check --strict dist/*
