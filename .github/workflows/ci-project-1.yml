name: CI Project 1 (Python)

on:
  push:
    branches: [ main ]
    # Hanya jalan jika file di dalam folder project-1 yang berubah
    paths:
      - 'project-1/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'project-1/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Set lokasi default untuk semua step 'run'
    defaults:
      run:
        working-directory: ./project-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v